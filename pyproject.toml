[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "castbook"
version = "0.1.0"
description = "Turn any ebook into a full-cast audiobook — per-character voices, local-first."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.18",
    "pdfminer.six>=20221105",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "llama-cpp-python>=0.2.75",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
align = [
    "faster-whisper>=1.0",
]
docx = [
    "python-docx>=1.1",
]
pocket = [
    # pip install torch --index-url https://download.pytorch.org/whl/cpu first for a CPU build
    "torch>=2.2",
    "pocket-tts>=4.0",
]
qwen = [
    # quality tier — VoiceDesign needs a GPU (CUDA/MPS); see `castbook doctor`
    "qwen-tts>=0.1",
]
dev = [
    "tomli>=2.0; python_version>='3.11'",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-beautifulsoup4",
    "respx>=0.21",
]

[project.scripts]
castbook = "castbook.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["castbook"]
package-data = { "castbook" = ["py.typed", "app/static/*"] }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ebooklib.*",
    "kokoro_onnx.*",
    "llama_cpp.*",
    "soundfile.*",
    "numpy.*",
    "bs4.*",
    "pocket_tts.*",
    "qwen_tts.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
