name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x86_64, ext: ""}
          - {os: windows-latest, target: windows-x86_64, ext: ".exe"}
          - {os: macos-14, target: macos-arm64, ext: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv && uv pip install -e . pyinstaller
      - name: build one-file binary
        shell: bash
        run: |
          SEP=":"
          [ "${{ runner.os }}" = "Windows" ] && SEP=";"
          uv run pyinstaller --onefile --name castbook \
            --add-data "castbook/app/static${SEP}castbook/app/static" \
            castbook/__main__.py
          dist/castbook${{ matrix.ext }} --version
      - name: package
        shell: bash
        run: |
          mkdir -p out
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../out/castbook-${{ matrix.target }}.zip" "castbook${{ matrix.ext }}"
          else
            tar -czf "../out/castbook-${{ matrix.target }}.tar.gz" "castbook${{ matrix.ext }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: castbook-${{ matrix.target }}
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
