name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install --system -e '.[dev]'
      - run: ruff format --check . && ruff check .
      - run: mypy castbook
      - run: pytest -q
